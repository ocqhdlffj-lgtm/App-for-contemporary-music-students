<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>닮은꼴 스타일</title>
  <meta name="description" content="얼굴 특징으로 동물상과 닮은꼴 연예인을 찾고, 내 얼굴형에 맞는 베스트 스타일링까지 추천해 주는 앱">
  <style>
:root {
  --bg: #fff7fa; --card: #ffffff; --fg: #1d1b20; --muted: #6b6470;
  --line: #f0dfe6; --accent: #ff4f8b; --accent-2: #7b5cff; --accent-soft: #ffe4ee;
  --ok: #17692f; --warn-bg: #fff4e5; --warn-fg: #7a4100; --error: #b3261e;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17141a; --card: #221e26; --fg: #f3eef6; --muted: #b3a9ba;
    --line: #3a3240; --accent: #ff6b9e; --accent-2: #9b85ff; --accent-soft: #3d2531;
    --ok: #6fd08c; --warn-bg: #3a2a14; --warn-fg: #ffcf8a; --error: #ff8a80;
  }
}
:root[data-theme="dark"] {
  --bg: #17141a; --card: #221e26; --fg: #f3eef6; --muted: #b3a9ba;
  --line: #3a3240; --accent: #ff6b9e; --accent-2: #9b85ff; --accent-soft: #3d2531;
  --ok: #6fd08c; --warn-bg: #3a2a14; --warn-fg: #ffcf8a; --error: #ff8a80;
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 15px/1.6 system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  word-break: keep-all; overflow-wrap: anywhere;
}
header { padding: 14px 16px 10px; text-align: center; }
h1 {
  font-size: 20px; margin: 0;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.tagline { margin: 0; font-size: 12px; color: var(--muted); }
main { max-width: 560px; margin: 0 auto; padding: 4px 16px 48px; }
h2 { font-size: 19px; margin: 8px 0 4px; }
h3 { font-size: 16px; margin: 0 0 8px; }
.muted { color: var(--muted); font-size: 13px; margin: 0 0 12px; }

/* ── 버튼 ── */
.btn {
  display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; padding: 12px 16px; min-height: 48px; border-radius: 12px;
  border: 1.5px solid var(--line); background: var(--card); color: var(--fg);
  font: inherit; font-weight: 600; cursor: pointer;
}
.btn.primary { background: linear-gradient(90deg, var(--accent), var(--accent-2)); color: #fff; border: 0; }
.btn:disabled { opacity: .45; cursor: default; }
.btn:focus-visible, .choice:focus-visible, .match:focus-visible, .link-btn:focus-visible, .back-btn:focus-visible {
  outline: 3px solid var(--accent-2); outline-offset: 2px;
}
.btn.big { width: 100%; padding: 16px; }
.btn-title { font-size: 17px; }
.btn-sub { font-size: 12px; font-weight: 400; opacity: .85; }
.back-btn, .link-btn {
  background: none; border: 0; color: var(--muted); font: inherit; font-size: 14px;
  padding: 8px 0; cursor: pointer;
}
.link-btn { color: var(--accent); display: block; margin: 12px auto 0; font-weight: 600; }
.row-actions { display: flex; gap: 10px; margin: 20px 0 8px; }
.row-actions .btn { flex: 1; }

/* ── 홈 ── */
.hero { text-align: center; padding: 12px 0 8px; }
.hero-emoji { font-size: 28px; letter-spacing: 2px; }
.hero h2 { font-size: 22px; }
.setting { margin: 14px 0; }
.setting-title { font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
.start-actions { display: grid; gap: 10px; margin-top: 20px; }
.privacy { font-size: 12px; color: var(--muted); text-align: center; margin-top: 16px; }

/* ── 선택지 ── */
.choices { display: flex; flex-wrap: wrap; gap: 8px; }
.choice {
  flex: 1 1 calc(50% - 8px); min-width: 120px; min-height: 48px;
  display: flex; flex-direction: column; align-items: flex-start; justify-content: center;
  padding: 10px 12px; border-radius: 12px; border: 1.5px solid var(--line);
  background: var(--card); color: var(--fg); font: inherit; text-align: left; cursor: pointer;
}
.choice.on { border-color: var(--accent); background: var(--accent-soft); }
.choice-label { font-weight: 600; }
.choice-hint { font-size: 12px; color: var(--muted); }
.question { margin: 16px 0; }
.q-title { font-weight: 700; margin-bottom: 8px; }
.quiz > .btn.primary { width: 100%; margin-top: 8px; }

/* ── 사진 ── */
.tips { margin: 8px 0 14px; padding-left: 20px; color: var(--muted); font-size: 13px; }
.photo > .btn.primary { width: 100%; }
.stage canvas { display: block; width: 100%; height: auto; margin-top: 14px; border-radius: var(--radius); }
.status { font-size: 14px; margin: 10px 0; }
.status.ok { color: var(--ok); font-weight: 600; }
.status.error { color: var(--error); font-weight: 600; }
.after { display: grid; gap: 10px; }
.warning {
  background: var(--warn-bg); color: var(--warn-fg); border-radius: 10px;
  padding: 8px 12px; font-size: 13px; margin: 8px 0;
}
.visually-hidden {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap;
}

/* ── 결과: 동물상 카드 ── */
.type-card {
  background: var(--card); border: 1.5px solid var(--line); border-radius: 18px;
  padding: 18px; margin-top: 8px; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px;
}
.type-emoji {
  font-size: 44px; width: 72px; height: 72px; border-radius: 50%;
  display: grid; place-items: center; background: var(--accent-soft);
}
.type-kicker { font-size: 12px; color: var(--muted); }
.type-name { margin: 0; font-size: 24px; }
.type-desc { margin: 4px 0 0; font-size: 14px; }
.mix, .type-card .chips { grid-column: 1 / -1; }
.mix { margin-top: 10px; display: grid; gap: 4px; }
.mix-row, .score-row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.mix-label { width: 92px; flex: none; }
.bar { flex: 1; height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
.bar-fill { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
.mix-pct, .score { width: 40px; text-align: right; flex: none; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip {
  font-size: 12px; padding: 3px 10px; border-radius: 999px;
  background: var(--accent-soft); color: var(--fg);
}
.chip.warn { background: var(--warn-bg); color: var(--warn-fg); margin-left: 6px; font-weight: 600; }
.question.check-me .choices { outline: 2px dashed var(--warn-fg); outline-offset: 4px; border-radius: 12px; }
.review > .btn.primary { width: 100%; margin-top: 8px; }
.chip.soft { background: transparent; border: 1px solid var(--line); color: var(--muted); }

/* ── 결과: 닮은꼴 ── */
.matches { margin-top: 22px; }
.match-list { display: grid; gap: 8px; }
.match {
  display: flex; gap: 12px; align-items: center; width: 100%; text-align: left;
  padding: 12px; border-radius: var(--radius); border: 1.5px solid var(--line);
  background: var(--card); color: var(--fg); font: inherit; cursor: pointer;
}
.match.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.avatar {
  flex: none; width: 52px; height: 52px; border-radius: 50%; font-size: 28px;
  display: grid; place-items: center; background: var(--accent-soft);
}
.match-body { flex: 1; min-width: 0; display: grid; gap: 4px; }
.match-head { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.match-rank { font-size: 12px; font-weight: 700; color: var(--accent); }
.match-name { font-size: 17px; font-weight: 700; }
.match-job { font-size: 12px; color: var(--muted); }
.match-common { font-size: 12px; color: var(--muted); }

/* ── 결과: 스타일링 ── */
.styling { margin-top: 24px; }
.styling-head .muted { margin-bottom: 10px; }
.celeb-look {
  border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px; color: var(--fg);
  background: linear-gradient(135deg, var(--accent-soft), var(--card));
  border: 1.5px solid var(--accent);
}
.ext-link { display: inline-block; margin-top: 6px; font-size: 13px; color: var(--accent); font-weight: 600; }
.style-sec {
  background: var(--card); border: 1.5px solid var(--line); border-radius: var(--radius);
  padding: 14px 16px; margin-bottom: 12px;
}
.why { font-size: 14px; margin: 0 0 8px; }
.sub { font-size: 12px; font-weight: 700; color: var(--muted); margin-top: 8px; }
ul.plain, ul.checks, ul.crosses, ul.dots { list-style: none; padding: 0; margin: 4px 0; }
ul.checks li, ul.crosses li, ul.dots li { position: relative; padding-left: 22px; margin: 4px 0; font-size: 14px; }
ul.checks li::before { content: "✓"; position: absolute; left: 2px; color: var(--accent); font-weight: 700; }
ul.crosses li::before { content: "✕"; position: absolute; left: 2px; color: var(--muted); }
ul.dots li::before { content: "•"; position: absolute; left: 6px; color: var(--accent-2); font-weight: 700; }
.swatches { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 6px 0 10px; }
.swatch { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.swatch-dot { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line); flex: none; }

.disclaimer-inline, .disclaimer { font-size: 12px; color: var(--muted); margin: 10px 0; }
.disclaimer { background: var(--warn-bg); color: var(--warn-fg); border-radius: 10px; padding: 8px 12px; }

.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
  background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px;
  font-size: 14px; z-index: 10;
}

@media (max-width: 360px) {
  .choice { flex-basis: 100%; }
  .swatches { grid-template-columns: repeat(2, 1fr); }
}
</style>

  <header>
    <h1>닮은꼴 스타일</h1>
    <p class="tagline">닮은 연예인 찾고, 베스트 스타일링까지</p>

  <script>
/* js/ns.js */
window.LA = window.LA || {};
</script>
  <script>
/* js/features.js */
(function (LA) {
  // 얼굴 랜드마크(MediaPipe FaceLandmarker 478점) → 특징 벡터.
  // DOM·네트워크를 전혀 모르는 순수 함수만 둔다 — 테스트는 tests/fixtures의
  // 평균 얼굴 좌표만으로 돌아간다.
  //
  // 특징 벡터의 각 축은 -1 ~ +1이고 0이 "평균 얼굴"이다. 평균(BASE.mean)은
  // MediaPipe 평균 얼굴 메시를 60cm 거리에서 정면 촬영했다고 보고 투영한
  // 값이다. 원근 보정 없이 메시 좌표를 그대로 쓰면 실제 사진에서 얼굴 길이
  // 비율이 12% 가량 크게 나와 거의 모든 사람이 "긴 얼굴"로 분류된다(촬영
  // 거리 때문에 앞쪽에 있는 이마·턱 끝이 뒤쪽에 있는 광대 옆선보다 크게
  // 찍히기 때문). 표준편차(sd)는 인구 통계로 검증한 값이 아니라 "±2sd면
  // 눈에 띄게 다르다"는 감각으로 잡은 휴리스틱이다 — README 참고.

  // MediaPipe face mesh 인덱스. 33/133·263/362는 각 눈의 바깥/안쪽 끝.
  var IDX = {
    top: 10, chin: 152,
    cheekR: 234, cheekL: 454,
    jawR: 172, jawL: 397,
    eyeR: { outer: 33, inner: 133, upper: 159, lower: 145 },
    eyeL: { outer: 263, inner: 362, upper: 386, lower: 374 },
    lipTop: 0, lipBottom: 17, mouthR: 61, mouthL: 291,
    noseTip: 1
  };

  var BASE = {
    faceRatio: { mean: 1.2934, sd: 0.07 },  // 얼굴 세로(이마 중앙~턱 끝) / 광대 폭
    jawRatio: { mean: 0.7982, sd: 0.04 },   // 턱각 폭 / 광대 폭
    eyeTilt: { mean: 1.156, sd: 4.0 },      // 눈꼬리 기울기(도). +면 바깥쪽이 올라감
    eyeOpen: { mean: 0.2655, sd: 0.045 },   // 눈 세로 / 눈 가로
    eyeWidth: { mean: 0.1843, sd: 0.012 },  // 눈 가로 / 광대 폭
    lipRatio: { mean: 0.4021, sd: 0.08 }    // 입술 두께(윗입술 위~아랫입술 아래) / 입 너비
  };

  // 특징 벡터의 축 이름과 원시 측정값의 대응. 순서는 화면·테스트에서 그대로 쓴다.
  var DIMS = ['faceLength', 'jawWidth', 'eyeTilt', 'eyeRound', 'eyeSize', 'lipFull'];
  var RAW_OF = {
    faceLength: 'faceRatio', jawWidth: 'jawRatio', eyeTilt: 'eyeTilt',
    eyeRound: 'eyeOpen', eyeSize: 'eyeWidth', lipFull: 'lipRatio'
  };

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function dist(a, b) { return Math.sqrt((a[0] - b[0]) * (a[0] - b[0]) + (a[1] - b[1]) * (a[1] - b[1])); }

  // 랜드마크를 픽셀 좌표 [x, y]로 바꾼다. MediaPipe 결과({x, y} 0~1)와
  // 테스트 픽스처([x, y] 배열)를 둘 다 받는다. 가로·세로 비율이 다른 사진에서
  // 정규화 좌표를 그대로 쓰면 거리가 찌그러지므로 반드시 픽셀로 환산한다.
  function toPixels(landmarks, width, height) {
    return landmarks.map(function (p) {
      return Array.isArray(p) ? [p[0] * width, p[1] * height] : [p.x * width, p.y * height];
    });
  }

  // 눈꼬리 기울기(도). 화면 y축은 아래가 +이므로 바깥 끝이 안쪽 끝보다
  // 위(y가 작음)에 있으면 +가 되도록 inner.y - outer.y를 쓴다. 가로 성분에
  // 절댓값을 쓰는 건 셀카 좌우 반전 사진에서도 같은 값이 나오게 하기 위함.
  //
  // 고개 기울기(roll)는 따로 보정하지 않는다: 얼굴 전체가 r만큼 돌면 한쪽
  // 눈은 +r, 반대쪽 눈은 -r만큼 기울기가 바뀌므로 두 눈의 평균을 쓰는 순간

    }

    if (ex && ex.smile > SMILE_LIMIT) {
      warnings.push('웃는 표정이라 눈이 가늘고 입술이 얇게 측정됐을 수 있어요. 다음 화면에서 직접 확인해 주세요.');

      expression: ex, unreliable: unreliable, warnings: warnings

  }

    if (v.jawWidth < -0.45) return 'heart';

    expressionOf: expressionOf,
    faceShapeOf: faceShapeOf
  };
})(window.LA);

  function choiceGroup(options, selected, onPick) {
    var wrap = el('div', 'choices');
    options.forEach(function (o) {
      var b = button('choice' + (o.value === selected ? ' on' : ''), null, function () {

      b.setAttribute('data-value', o.value);
      b.appendChild(el('span', 'choice-label', o.label));
      if (o.hint) b.appendChild(el('span', 'choice-hint', o.hint));

  function chip(text, kind) { return el('span', 'chip' + (kind ? ' ' + kind : ''), text); }

(function (LA) {
  var ui = LA.ui;
  var MAX_SIDE = 1024;

  // 분석 결과를 눈으로 확인할 수 있게, 실제로 계산에 쓴 점만 찍는다.
  var SHOWN = (function () {
    var I = LA.features.IDX;
    return [I.top, I.chin, I.cheekR, I.cheekL, I.jawR, I.jawL,
      I.eyeR.outer, I.eyeR.inner, I.eyeR.upper, I.eyeR.lower,
      I.eyeL.outer, I.eyeL.inner, I.eyeL.upper, I.eyeL.lower,
      I.lipTop, I.lipBottom, I.mouthR, I.mouthL];
  })();

  // 큰 사진은 긴 변 1024px로 줄여 그린다 — 분석 속도 때문이며, 랜드마크
  // 모델 입력은 어차피 훨씬 작게 줄여 쓰므로 정확도 손실은 없다.
  function toCanvas(img) {
    var w = img.naturalWidth, h = img.naturalHeight;
    var k = Math.min(1, MAX_SIDE / Math.max(w, h));
    var c = document.createElement('canvas');
    c.width = Math.round(w * k);
    c.height = Math.round(h * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c;
  }

  function drawPoints(canvas, landmarks) {
    var ctx = canvas.getContext('2d');
    var r = Math.max(2, Math.round(canvas.width / 180));
    ctx.fillStyle = '#ff4f8b';
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = Math.max(1, r / 2);
    SHOWN.forEach(function (i) {
      var p = landmarks[i];
      ctx.beginPath();
      ctx.arc(p.x * canvas.width, p.y * canvas.height, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('이미지를 열 수 없어요')); };
      img.src = url;
    });

      pick.textContent = '다른 사진 선택하기';
      if (offerQuiz) after.appendChild(ui.button('btn', '✍️ 사진 없이 직접 골라서 찾기', handlers.onQuiz));

    input.addEventListener('change', function () {

    return s;
  }

  function stylingView(model, match) {
    var st = stylingFor(model, match);
    var root = ui.el('div', 'styling');

    var head = ui.el('div', 'styling-head');
    head.appendChild(ui.el('h2', null, '베스트 스타일링'));
    head.appendChild(ui.el('p', 'muted',
      st.faceShapeLabel + ' 얼굴 · ' + LA.profile.ANIMALS[st.animalKey].name + ' 기준' +
      (match ? ' · ' + match.celeb.name + ' 무드 반영' : '')));
    root.appendChild(head);

    if (st.celebLook) {
      var look = ui.el('div', 'celeb-look');
      look.appendChild(ui.el('h3', null, '✨ ' + st.celebLook.title));
      look.appendChild(ui.list(st.celebLook.items, 'checks'));
      if (match) {
        var a = ui.el('a', 'ext-link', match.celeb.name + ' 스타일 사진 검색 ↗');
        a.href = 'https://search.naver.com/search.naver?where=image&query=' +
          encodeURIComponent(match.celeb.name + ' 스타일');
        a.target = '_blank';
        a.rel = 'noopener';
        look.appendChild(a);
      }
      root.appendChild(look);
    }

    var hair = section('헤어', '💇');
    hair.appendChild(ui.el('p', 'why', st.hair.why));
    hair.appendChild(ui.el('div', 'sub', '추천'));
    hair.appendChild(ui.list(st.hair.best, 'checks'));
    hair.appendChild(ui.el('div', 'sub', '피하면 좋은'));
    hair.appendChild(ui.list(st.hair.avoid, 'crosses'));
    root.appendChild(hair);

    var face = section(st.face.title, model.gender === 'M' ? '🧴' : '💄');
    face.appendChild(ui.list(st.face.items, 'dots'));
    root.appendChild(face);

    var fashion = section('패션 · ' + st.fashion.keyword, '👗');
    fashion.appendChild(ui.list(st.fashion.items, 'checks'));
    fashion.appendChild(ui.el('p', 'why', st.fashion.tip));
    root.appendChild(fashion);

    var colors = section(st.colors.title, '🎨');
    var sw = ui.el('div', 'swatches');
    st.colors.swatches.forEach(function (c) {
      var item = ui.el('div', 'swatch');
      var dot = ui.el('span', 'swatch-dot');
      dot.style.background = c.hex;
      item.appendChild(dot);
      item.appendChild(ui.el('span', 'swatch-name', c.name));
      sw.appendChild(item);
    });
    colors.appendChild(sw);
    colors.appendChild(ui.el('p', 'why', st.colors.tip));
    if (!st.colors.diagnosed) {
      colors.appendChild(ui.el('p', 'muted', '퍼스널컬러 체크를 건너뛰어 무난한 뉴트럴 팔레트를 보여드려요.'));
    }
    root.appendChild(colors);

    var acc = section('안경 · 액세서리', '👓');
    acc.appendChild(ui.list(st.accessories.items, 'dots'));
    root.appendChild(acc);

    return root;
  }

  // handlers = { onRestart(), onShare(text) }
  function render(model, handlers, celebs) {
    var computed = compute(model, celebs || LA.CELEBS);
    var root = ui.el('section', 'result');
    var selected = 0;

    root.appendChild(typeCard(computed));
    (model.warnings || []).forEach(function (w) { root.appendChild(ui.el('p', 'warning', '⚠ ' + w)); });

    var matchesBox = ui.el('div', 'matches');
    matchesBox.appendChild(ui.el('h2', null, '닮은꼴 연예인 TOP ' + computed.matches.length));
    matchesBox.appendChild(ui.el('p', 'muted', '눌러서 그 연예인 무드의 스타일링을 볼 수 있어요.'));
    var matchList = ui.el('div', 'match-list');
    matchesBox.appendChild(matchList);
    root.appendChild(matchesBox);

    var stylingHost = ui.el('div');
    root.appendChild(stylingHost);

    function draw() {
      matchList.textContent = '';
      computed.matches.forEach(function (m, i) {
        matchList.appendChild(matchCard(m, i + 1, i === selected, function () {
          selected = i;
          draw();
        }));
      });
      stylingHost.textContent = '';
      stylingHost.appendChild(stylingView(model, computed.matches[selected]));
    }
    draw();

    var actions = ui.el('div', 'row-actions');
    actions.appendChild(ui.button('btn', '처음부터 다시', handlers.onRestart));
    actions.appendChild(ui.button('btn primary', '결과 공유하기', function () {
      handlers.onShare(shareText(model, computed));
    }));
    root.appendChild(actions);
    root.appendChild(ui.el('p', 'disclaimer-inline',
      '스타일링은 얼굴형·인상별로 흔히 쓰는 공식을 바탕으로 한 출발점이에요. 마음에 드는 것부터 가볍게 시도해 보세요.'));
    root.appendChild(ui.disclaimer());
    return root;
  }

  LA.ui.result = { render: render, compute: compute, shareText: shareText };
})(window.LA);
</script>
  <script>
/* js/app.js */
(function (LA) {
  // 화면 흐름: home → (photo → review | quiz) → color → result.
  // 각 화면은 #screen을 비우고 새로 그린다. 화면 전환마다 history에 기록해
  // 안드로이드 뒤로가기·브라우저 뒤로가기가 앱 안에서 동작하게 한다.
  //
  // analysis: 사진 분석 결과(확인 화면에서 사용자가 고치기 전)
  // pending: 사진/퀴즈로 얻은 특징 벡터(퍼스널컬러 체크 전 단계)
  // result:  결과 화면이 그리는 모델 전체. 저장되는 것도 이것뿐이다(사진 없음).
  var state = { screen: 'home', settings: null, analysis: null, pending: null, result: null };

  function host() { return document.getElementById('screen'); }

  function go(name) {
    render(name);
    try { history.pushState({ screen: name }, ''); } catch (e) { /* file:// 등 */ }
  }

  function toast(msg) {
    var t = LA.ui.el('div', 'toast', msg);
    t.setAttribute('role', 'status');
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 2200);
  }

  function share(text) {
    var url = location.href.split('#')[0];
    if (navigator.share) {
      navigator.share({ title: '닮은꼴 스타일', text: text, url: url }).catch(function () {});
      return;
    }
    var full = text + '\n' + url;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(full).then(function () { toast('결과를 복사했어요!'); },
        function () { window.prompt('아래 내용을 복사해 공유하세요', full); });
    } else {
      window.prompt('아래 내용을 복사해 공유하세요', full);
    }
  }

  function toColor(pending) {
    state.pending = pending;
    go('color');
  }

  var SCREENS = {
    home: function () {
      var last = LA.storage.load();
      return LA.ui.home.render(state.settings, {
        onChange: function (s) { state.settings = s; LA.storage.saveSettings(s); },
        onPhoto: function () { go('photo'); },
        onQuiz: function () { go('quiz'); },
        onLast: last ? function () {
          // 지난 결과도 지금 홈 화면의 설정(스타일 기준·범위)으로 다시 보여준다.
          state.result = Object.assign({}, last, state.settings);
          go('result');
        } : null
      });
    },
    photo: function () {
      return LA.ui.photo.render({
        onBack: function () { go('home'); },
        onQuiz: function () { go('quiz'); },
        onDone: function (a) { state.analysis = a; go('review'); }
      });
    },
    review: function () {
      var a = state.analysis;
      return LA.ui.review.render(a, {
        onBack: function () { go('home'); },
        onDone: function (v) { toColor({ vector: v, warnings: a.warnings, source: 'photo' }); }
      });
    },
    quiz: function () {
      return LA.ui.quiz.render({
        onBack: function () { go('home'); },
        onDone: function (v) { toColor({ vector: v, warnings: [], source: 'quiz' }); }
      });
    },
    color: function () {
      return LA.ui.color.render({
        onBack: function () { go('home'); },
        onDone: function (pc) {
          var p = state.pending;
          state.result = {
            vector: p.vector, warnings: p.warnings, source: p.source,
            gender: state.settings.gender, scope: state.settings.scope,
            personalColor: pc
          };
          LA.storage.save(state.result);
          go('result');
        }
      });
    },
    result: function () {
      return LA.ui.result.render(state.result, {
        onRestart: function () { go('home'); },
        onShare: share
      });
    }
  };

  // 앞 단계 데이터가 없는 화면(새로고침 후 뒤로가기 등)은 홈으로 돌린다.
  function render(name) {
    if (name === 'review' && !state.analysis) name = 'home';
    if (name === 'color' && !state.pending) name = 'home';
    if (name === 'result' && !state.result) name = 'home';
    if (!SCREENS[name]) name = 'home';
    state.screen = name;
    var h = host();
    h.textContent = '';
    h.appendChild(SCREENS[name]());
    window.scrollTo(0, 0);
  }

  function start() {
    state.settings = LA.storage.loadSettings();
    var errors = LA.match.validate(LA.CELEBS);
    if (errors.length && window.console) console.warn('연예인 데이터 오류:', errors);
    window.addEventListener('popstate', function (e) {
      render((e.state && e.state.screen) || 'home');
    });
    try { history.replaceState({ screen: 'home' }, ''); } catch (e) { /* file:// 등 */ }
    render('home');
  }

  LA.app = { start: start, _state: state, _render: render };
})(window.LA);
</script>
  <script>LA.app.start();</script>
</body>
